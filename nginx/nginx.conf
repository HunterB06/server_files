http {
    server {
        listen 80;

        location / {
        }
    }

    server {
        listen 80;
        server_name deluge.*;

        location / {
            proxy_pass http://deluge:8112;
        }
    }

    server {
        listen 80;
        server_name sonarr.*;

        location / {
            proxy_pass http://sonarr:8989;
        }
    }

    server {
        listen 80;
        server_name radarr.*;

        location / {
            proxy_pass http://radarr:7878;
        }
    }

    server {
        listen 80;
        server_name prowlarr.*;

        location / {
            proxy_pass http://prowlarr:9696;
        }
    }

    server {
        listen 80;
        server_name jellyfin.*;

        location / {
            proxy_pass http://jellyfin:8096;
        }
    }
}

events {
}
