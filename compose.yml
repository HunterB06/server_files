name: media-server

networks:
  media-server-network:

services:
  init:
    build:
      context: ./init
    environment:
        GID: $GID
    volumes:
      - ${MEDIA_DRIVE}:/data
    restart: "no"

  deluge:
    build:
      context: ./deluge
      args:
        UID: $DELUGE_UID
        GID: $GID
        USER: deluge
    env_file: .env
    ports:
      - 8112:8112
    depends_on:
      init:
        condition: service_completed_successfully
    networks:
      - media-server-network
    volumes:
      - ${MEDIA_DRIVE}:/data
      - ${DELUGE_CONFIG}:/home/deluge/.config/deluge

  sonarr:
    build:
      context: ./sonarr
      args:
        UID: $SONARR_UID
        GID: $GID
        USER: sonarr
    env_file: .env
    ports:
      - 8989:8989
    depends_on:
      init:
        condition: service_completed_successfully
    networks:
      - media-server-network
    volumes:
      - ${MEDIA_DRIVE}:/data
      - ${SONARR_CONFIG}:/home/sonarr/.config/sonarr
