name: media-server

networks:
  media-server-network:

volumes:
  certificates:
  nginx-conf:

services:
  init:
    build:
      context: ./init
    environment:
        GID: $GID
    volumes:
      - ${MEDIA_DRIVE}:/data
    restart: "no"

  deluge:
    build:
      context: ./deluge
      args:
        UID: $DELUGE_UID
        GID: $GID
        USER: deluge
    env_file: .env
    ports:
      - 8112
    depends_on:
      init:
        condition: service_completed_successfully
    networks:
      - media-server-network
    volumes:
      - ${MEDIA_DRIVE}:/data
      - ${CONFIG}/deluge:/home/deluge/.config/deluge
    restart: unless-stopped

  sonarr:
    build:
      context: ./sonarr
      args:
        UID: $SONARR_UID
        GID: $GID
        USER: sonarr
    env_file: .env
    ports:
      - 8989
    depends_on:
      init:
        condition: service_completed_successfully
    networks:
      - media-server-network
    volumes:
      - ${MEDIA_DRIVE}:/data
      - ${CONFIG}/sonarr:/home/sonarr/.config/sonarr
    restart: unless-stopped

  prowlarr:
    build:
      context: ./prowlarr
      args:
        UID: $PROWLARR_UID
        GID: $GID
        USER: prowlarr
    env_file: .env
    ports:
      - 9696
    networks:
      - media-server-network
    volumes:
      - ${CONFIG}/prowlarr:/home/prowlarr/.config/prowlarr
    restart: unless-stopped

  radarr:
    build:
      context: ./radarr
      args:
        UID: $RADARR_UID
        GID: $GID
        USER: radarr
    env_file: .env
    ports:
      - 7878
    depends_on:
      init:
        condition: service_completed_successfully
    networks:
      - media-server-network
    volumes:
      - ${MEDIA_DRIVE}:/data
      - ${CONFIG}/radarr:/home/radarr/.config/radarr
    restart: unless-stopped

  flaresolverr:
    image: flaresolverr/flaresolverr
    environment:
      - LOG_LEVEL=info
      - LOG_HTML=false
      - CAPTCHA_SOLVER=none
      - TZ=Europe/Paris
    ports:
      - 8191
    networks:
      - media-server-network
    restart: unless-stopped

  jellyfin:
    build:
      context: ./jellyfin
      args:
        UID: $JELLYFIN_UID
        GID: $GID
        USER: jellyfin
    env_file: .env
    ports:
      - 8096/tcp # HTTP
      - 8920/tcp # HTTPS
      - 7359/udp # UDP
    depends_on:
      init:
        condition: service_completed_successfully
    networks:
      - media-server-network
    volumes:
      - ${MEDIA_DRIVE}:/media
      - ${CONFIG}/jellyfin:/config
    restart: unless-stopped

  nginx:
    build:
      context: ./nginx
    ports:
      - 80:80
      - 443:443
    env_file: .env
    volumes:
      - nginx-conf:/etc/nginx/conf.d
      - ./nginx/nginx.conf.template:/etc/nginx/conf.d/nginx.conf.template:ro
      - certificates:/etc/letsencrypt/live
    networks:
      - media-server-network
    depends_on:
      - deluge
      - jellyfin
      - sonarr
      - radarr
      - prowlarr
    restart: unless-stopped
